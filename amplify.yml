
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.22.3
        - nvm use 22.22.3
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/insurance-management-ui/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
